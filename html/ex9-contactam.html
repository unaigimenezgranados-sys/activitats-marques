<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacta'm</title>
</head>
<body>
    <h1>Contacta amb mi</h1>

    <form>
        <label for="nom">Nom:</label>
        <input type="text" id="nom" name="nom" required placeholder="Aqui el teu nom">

        <label for="correu">Correu electronic:</label>
        <input type="email" id="correu" name="correu" required>

        <label for="missatge">Missatge:</label>
        <textarea id="missatge" name="missatge" required></textarea>

        <button type="submit">Enviar</button>
    </form>
</body>
</html>
